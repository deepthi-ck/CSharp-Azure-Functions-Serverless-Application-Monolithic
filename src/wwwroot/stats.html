<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Statistics · Azure Functions Serverless</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <h2 class="title">Runtime statistics</h2>
        <div class="meta">
          <span class="pill" id="meta-branch">Branch loading</span>
          <span class="pill" id="meta-customer">Customer loading</span>
          <span class="pill" id="meta-tfm"></span>
        </div>
      </header>
      <main class="content">
        <p class="lede">Counters come from AppStatistics BCL increments (hits, misses, puts, gets, deletes, replication, eviction, expiration).</p>
        <section class="grid">
          <article class="card"><p class="kpi-label">Hits</p><p class="kpi" id="stat-hits">0</p></article>
          <article class="card"><p class="kpi-label">Misses</p><p class="kpi" id="stat-misses">0</p></article>
          <article class="card"><p class="kpi-label">Puts</p><p class="kpi" id="stat-puts">0</p></article>
          <article class="card"><p class="kpi-label">Gets</p><p class="kpi" id="stat-gets">0</p></article>
          <article class="card"><p class="kpi-label">Deletes</p><p class="kpi" id="stat-deletes">0</p></article>
          <article class="card"><p class="kpi-label">Replications</p><p class="kpi" id="stat-replications">0</p></article>
          <article class="card"><p class="kpi-label">Evictions</p><p class="kpi" id="stat-evictions">0</p></article>
          <article class="card"><p class="kpi-label">Expirations</p><p class="kpi" id="stat-expirations">0</p></article>
          <article class="card"><p class="kpi-label">Primary entries</p><p class="kpi" id="stat-entries">0</p></article>
          <article class="card"><p class="kpi-label">Nodes</p><p class="kpi" id="stat-nodes">0</p></article>
        </section>
      </main>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script>FunctionsUi.boot("stats");</script>
</body>
</html>
